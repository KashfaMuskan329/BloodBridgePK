<rect x="75" y="204" width="260" height="170" rx="17" fill="#fff7f4"/><text x="102" y="253" font-size="23" font-weight="700" fill="#22334b">Public directories</text><text x="102" y="287" font-size="16" fill="#506379">PBTA · Sundas · Fatimid</text><text x="102" y="313" font-size="16" fill="#506379">PIMS · Children’s Hospital</text><text x="102" y="348" font-size="14" fill="#ac5d67">Public locations only</text>
<rect x="500" y="204" width="285" height="170" rx="17" fill="#fff7f4"/><text x="528" y="250" font-size="23" font-weight="700" fill="#22334b">Python + GeoJSON</text><text x="528" y="285" font-size="16" fill="#506379">Curate &amp; classify listings</text><text x="528" y="312" font-size="16" fill="#506379">Approximate map pins</text><text x="528" y="348" font-size="14" fill="#ac5d67">Never infer live inventory</text>
<rect x="951" y="204" width="255" height="170" rx="17" fill="#fff7f4"/><text x="977" y="250" font-size="23" font-weight="700" fill="#22334b">Amazon S3</text><text x="977" y="285" font-size="16" fill="#506379">Private data snapshot</text><text x="977" y="313" font-size="16" fill="#506379">Build-time sync</text><text x="977" y="347" font-size="14" fill="#ac5d67">Optional AWS pipeline</text>
<rect x="70" y="472" width="312" height="167" rx="17" fill="#fff7f4"/><text x="100" y="515" font-size="23" font-weight="700" fill="#22334b">AWS Amplify Hosting</text><text x="100" y="549" font-size="16" fill="#506379">Static HTML · CSS · JS</text><text x="100" y="579" font-size="16" fill="#506379">Six fictional patient stories</text><text x="100" y="610" font-size="14" fill="#ac5d67">Published after your deploy</text>
